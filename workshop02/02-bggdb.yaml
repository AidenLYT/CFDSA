---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-deploy
  namespace: bggns
  labels:
    name: bggdb
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      name: bggdb
  template:
    metadata:
      labels:
        name: bggdb
        version: v1
    spec:
      containers:
      - name: bggdb
        image: stackupiss/bgg-database:v1
        ports:
        - name: mysql
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bggdb-secret
              key: db_password
        livenessProbe:
          tcpSocket:
            port: mysql
          initialDelaySeconds: 60
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    name: bggdb
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
