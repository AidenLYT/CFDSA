---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
  labels:
    name: bggapp
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      name: bggapp
  template:
    metadata:
      labels:
        name: bggapp
        version: v1
    spec:
      containers:
      - name: bggapp
        image: stackupiss/bgg-backend:v1
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: BGG_DB_USER
          valueFrom:
            secretKeyRef:
              name: bggdb-secret
              key: db_user
        - name: BGG_DB_HOST
          value: bggdb-svc.bggns.svc.cluster.local
        - name: BGG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bggdb-secret
              key: db_password
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: NodePort
  selector:
    name: bggapp
  ports:
  - name: http
    port: 3000
    targetPort: http
