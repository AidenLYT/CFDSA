---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop03

---
apiVersion: v1
kind: Secret
metadata:
  name: umamiapp-secret
  namespace: workshop03
type: Opaque
data:
  # postgresql://umami:mydbpassword@umamidb-svc.workshop03.svc.cluster.local:5432/umami
  DATABASE_URL: cG9zdGdyZXNxbDovL3VtYW1pOm15ZGJwYXNzd29yZEB1bWFtaWRiLXN2Yy53b3Jrc2hvcDAzLnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvdW1hbWk=
  # generated with: openssl rand -hex 32
  APP_SECRET: NDIxZWJjM2IwMDNkNjQxY2JlZWVhZTFkM2Q1YmQyZDRkMzdmNGEzY2E5OTU3Njc3NzQ4ODc3NDEwMjBjNzY1Mg==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamiapp-deploy
  namespace: workshop03
  labels:
    name: umamiapp
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      name: umamiapp
  template:
    metadata:
      labels:
        name: umamiapp
        version: v1
    spec:
      containers:
      - name: umamiapp-container
        image: ghcr.io/umami-software/umami:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-port
          containerPort: 3000
        envFrom:
        - secretRef:
            name: umamiapp-secret
        readinessProbe:
          httpGet:
            path: /api/heartbeat
            port: http-port
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 256m
          limits:
            memory: 512Mi
            cpu: 256m

---
apiVersion: v1
kind: Service
metadata:
  name: umamiapp-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    name: umamiapp
  ports:
  - port: 3000
    targetPort: http-port

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umamiapp-hpa
  namespace: workshop03
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umamiapp-deploy
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umamiapp-httproute
  namespace: workshop03
spec:
  hostnames:
  - umami-172.24.255.200.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: umamiapp-svc
      namespace: workshop03
      port: 3000
