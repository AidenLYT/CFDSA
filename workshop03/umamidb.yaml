---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop03

---
apiVersion: v1
kind: Secret
metadata:
  name: umamidb-secret
  namespace: workshop03
type: Opaque
data:
  POSTGRES_USER: dW1hbWk=
  POSTGRES_PASSWORD: bXlkYnBhc3N3b3Jk
  POSTGRES_DB: dW1hbWk=

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: workshop03
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamidb-deploy
  namespace: workshop03
  labels:
    name: umamidb
    version: v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: umamidb
  template:
    metadata:
      labels:
        name: umamidb
        version: v1
    spec:
      volumes:
      - name: db-vol
        persistentVolumeClaim:
          claimName: umamidb-pvc
      containers:
      - name: umamidb-container
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: db-port
          containerPort: 5432
        envFrom:
        - secretRef:
            name: umamidb-secret
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: db-vol
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources: {}

---
apiVersion: v1
kind: Service
metadata:
  name: umamidb-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    name: umamidb
  ports:
  - port: 5432
    targetPort: db-port
