---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-data-httproute
  namespace: workshop04
spec:
  hostnames:
  - data.172.24.255.200.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-svc
      namespace: workshop04
      port: 9000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console-httproute
  namespace: workshop04
spec:
  hostnames:
  - console.172.24.255.200.nip.io
  parentRefs:
  - name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: Exact
        value: /
      method: GET
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /rustfs/console/
        statusCode: 302
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-svc
      namespace: workshop04
      port: 9001
